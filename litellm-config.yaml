model_list:
  # Claude Opus 4.8
  - model_name: claude-opus-4-8
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: "os.environ/ANTHROPIC_API_KEY"
      cache_control_injection_points:
        - location: message
          role: system

  # Claude Sonnet 4.6
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: "os.environ/ANTHROPIC_API_KEY"
      cache_control_injection_points:
        - location: message
          role: system

  # Claude Haiku 4.5
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: "os.environ/ANTHROPIC_API_KEY"
      cache_control_injection_points:
        - location: message
          role: system
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: "os.environ/ANTHROPIC_API_KEY"
      cache_control_injection_points:
        - location: message
          role: system


litellm_settings:
  drop_params: true  # Drop unsupported params (like OpenAI specific params) instead of failing
  cache: true        # Enable in-memory response caching for exact duplicate requests
  cache_params:
    type: "redis"
    host: "redis"
    port: 6379

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"  # Optional: Enforces key verification if set
