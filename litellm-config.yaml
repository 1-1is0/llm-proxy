      cache_control_injection_points:
        - location: message
          role: system
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: "os.environ/ANTHROPIC_API_KEY"
      cache_control_injection_points:
        - location: message
          role: system

  # Gemini 3.5 Flash
  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: "os.environ/GEMINI_API_KEY"
      cache_control_injection_points:
        - location: message
          role: system

  # Gemini 3.5 Flash (Thinking / Reasoning Enabled)
  - model_name: gemini-3.5-flash-thinking
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: "os.environ/GEMINI_API_KEY"
      cache_control_injection_points:
        - location: message
          role: system

  # Gemini 3 Flash
  - model_name: gemini-3-flash
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: "os.environ/GEMINI_API_KEY"
      cache_control_injection_points:
        - location: message
          role: system
  - model_name: gemini-3-flash-preview
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: "os.environ/GEMINI_API_KEY"
      cache_control_injection_points:
        - location: message
          role: system

  # Gemini 3.1 Pro
  - model_name: gemini-3.1-pro
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: "os.environ/GEMINI_API_KEY"
      cache_control_injection_points:
        - location: message
          role: system
  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: "os.environ/GEMINI_API_KEY"
      cache_control_injection_points:
        - location: message
          role: system


litellm_settings:
  drop_params: true  # Drop unsupported params (like OpenAI specific params) instead of failing
  cache: true        # Enable in-memory response caching for exact duplicate requests
  cache_params:
    type: "redis"
    host: "redis"
    port: 6379

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"  # Optional: Enforces key verification if set
