services:
  litellm:
    image: ghcr.io/berriai/litellm-database:v1.87.1 # Pinned (not main-latest) to avoid floating-tag supply-chain risk
    container_name: litellm-proxy
    ports:
      - "127.0.0.1:4000:4000" # Exposes LiteLLM only locally on the host
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro # Mount the configuration file as read-only
    environment:
      # API Key for Anthropic models. Will be loaded from the host's .env file.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # API Key for Gemini models. Will be loaded from the host's .env file.
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Optional: Master API key to secure access to the LiteLLM proxy itself.
      # If not set, the proxy is open/unsecured.
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      # Optional log level setting (DEBUG, INFO, WARNING, ERROR)
      - LITELLM_LOG=${LITELLM_LOG:-INFO}
      # Postgres connection for cost tracking, virtual key/budget management and the /ui dashboard.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-litellm}
      # Restrict malloc arenas to prevent memory fragmentation and growth in Python
      - MALLOC_ARENA_MAX=2
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--use_v2_migration_resolver" ]
    depends_on:
      - redis
      - db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: litellm-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: litellm-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - NGINX_ENVSUBST_FILTER=DOMAIN
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - litellm
    restart: unless-stopped

volumes:
  redis-data:
  pgdata:

